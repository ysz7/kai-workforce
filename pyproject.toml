[project]
name = "kai-workforce"
version = "0.1.0"
description = "KAI Workforce - a local-first platform where an AI manager runs digital employees on your machine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "structlog>=24.4",
    "typer>=0.15",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
kai = "app.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "domain", "application", "infrastructure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.importlinter]
root_packages = ["app", "application", "domain", "infrastructure"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture: app -> application -> domain; infrastructure -> domain"
type = "layers"
layers = ["app", "application | infrastructure", "domain"]

[[tool.importlinter.contracts]]
name = "domain depends on nothing but the standard library and pydantic"
type = "forbidden"
source_modules = ["domain"]
forbidden_modules = [
    "app",
    "application",
    "infrastructure",
    "sqlalchemy",
    "alembic",
    "httpx",
    "openai",
    "anthropic",
    "playwright",
    "typer",
    "structlog",
]

[[tool.importlinter.contracts]]
name = "KAI knows the workforce contracts only, never infrastructure or a concrete employee"
type = "forbidden"
source_modules = ["application.kai"]
forbidden_modules = ["infrastructure", "app", "employees"]
