name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Architecture boundaries
        run: uv run lint-imports

      - name: English-only codebase
        run: uv run python scripts/check_english_only.py

      # No provider keys are configured: the suite must be green without one.
      - name: Tests
        run: uv run pytest
